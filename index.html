<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>For Rajathee 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#6b2b5e;--pk:#ff5c9a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#2b1b5e}
body{font-family:Fredoka,"Baloo 2","Trebuchet MS",sans-serif;color:var(--ink);overflow:hidden;text-align:center}
#sky{position:fixed;inset:0;background:linear-gradient(180deg,#3b2a7a 0%,#8a5cc9 35%,#ff9ccf 70%,#ffd6a8 100%)}
.star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;animation:tw 2s infinite alternate}
@keyframes tw{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.4)}}
.cloud{position:absolute;left:-200px;animation:drift linear infinite;opacity:.95}
@keyframes drift{to{transform:translateX(calc(100vw + 400px))}}
#hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%}
#castle{position:absolute;left:50%;bottom:17%;width:120px;margin-left:-60px;filter:drop-shadow(0 0 12px #fff8)}
.fl{position:fixed;z-index:1;pointer-events:none;animation:fly linear forwards}
@keyframes fly{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 14px;gap:8px}
.hide{display:none!important}
.title{font-family:Pacifico,cursive;font-size:32px;color:#fff;text-shadow:0 3px 0 #c2398a,0 0 18px #fff9;margin:0;line-height:1.25}
.sub{color:#fff;font-size:18px;text-shadow:0 2px 6px #0006}
#env{width:200px;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
#env .fl2{transform-origin:100px 70px;transition:transform .6s}
#env.open{animation:none}#env.open .fl2{transform:scaleY(-1)}
#env.open .ltr{transform:translateY(-60px);transition:transform .7s .4s}
.ltr{transition:transform .7s}
#stage{position:relative;width:min(340px,92vw);height:min(250px,30vh);flex:none}
.ch{position:absolute;bottom:0;height:100%;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1);animation:sw 3s ease-in-out infinite}
.ch svg{height:100%;width:auto;overflow:visible}
#her{left:50%;margin-left:-110px}#him{left:50%;margin-left:-10px;animation-delay:-1.5s}
.apart #her{transform:translateX(-45px)}.apart #him{transform:translateX(45px)}
.close #her{transform:translateX(18px) rotate(4deg)}.close #him{transform:translateX(-18px) rotate(-4deg)}
@keyframes sw{50%{margin-bottom:6px}}
.bl{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mid{position:absolute;left:50%;top:6%;margin-left:-22px;font-size:44px;animation:pul 1s infinite;opacity:0;transition:opacity 1s}
.close #mid{opacity:1}@keyframes pul{50%{transform:scale(1.3)}}
.pol{position:absolute;left:50%;top:0;width:150px;margin-left:-75px;background:#fff;padding:8px 8px 28px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 10px 24px #0005;font-family:Pacifico;font-size:13px;color:var(--ink)}
.pol img{width:100%;height:min(190px,26vh);object-fit:cover;object-position:50% 25%;display:block}
.pol:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-28px;width:56px;height:18px;background:#ffd3e8cc;transform:rotate(3deg)}
.pol span{position:absolute;bottom:4px;left:0;right:0}
#card{background:#fff9fd;border:4px solid #ff8dc2;border-radius:26px;width:min(380px,94vw);flex:1 1 auto;min-height:0;max-height:46vh;overflow:auto;padding:18px 20px;box-shadow:0 8px 0 #c2398a88,0 0 30px #fff7;font-size:18px;line-height:1.4;animation:pg .7s}
@keyframes pg{from{transform:perspective(700px) rotateY(-70deg) scale(.8);opacity:0}}
#card p{margin:0 0 .8em;opacity:0;animation:in .8s forwards}
@keyframes in{from{transform:translateY(10px)}to{opacity:1}}
#card b{color:#e0307f}
.btn{font:600 19px Fredoka,sans-serif;color:#fff;background:linear-gradient(#ff7eb3,#ff4f8f);border:3px solid #fff;border-radius:40px;padding:10px 26px;box-shadow:0 6px 0 #b82a70;cursor:pointer;flex:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b82a70}
.btn.nx{animation:wig 1.6s infinite}@keyframes wig{0%,70%,100%{transform:none}80%{transform:rotate(-4deg) scale(1.06)}90%{transform:rotate(4deg) scale(1.06)}}
#ans{display:flex;gap:16px;align-items:center;min-height:64px}
#no{position:relative;background:linear-gradient(#b9a8cc,#9783ad);box-shadow:0 6px 0 #6d5a85}
#rb{position:fixed;left:50%;top:6%;width:140vw;margin-left:-70vw;z-index:1;opacity:0;transition:opacity 2s;pointer-events:none}
.yes #rb{opacity:.85}
</style></head><body>

function scene(){render(P[i]);const st=$('stage');st.className=i<2?'apart':'close';$('pol').classList.toggle('hide',i!==5);['her','him'].forEach(x=>$(x).classList.toggle('hide',i===5));$('mid').classList.toggle('hide',i===5);

function next(){i++;scene();fl()}
